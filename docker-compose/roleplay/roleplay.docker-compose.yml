services:
  roleplay-db:
    platform: linux/amd64
    image: postgres:17
    restart: always
    env_file:
      - roleplay.env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - roleplay-db-data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSE_PORT}:5432"
    networks:
      - roleplay-network
      - shared-net

  roleplay-service:
    platform: linux/amd64
    image: crodion/roleplay-service:latest
    ports:
      - "8201-8203:8200"
    env_file:
      - roleplay.env
    environment:
      - SERVICE_ROUTE=/api/roleplay
      - GATEWAY_URL=http://gateway:3000
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
    depends_on:
      - roleplay-db
    networks:
      - roleplay-network
      - shared-net
    deploy:
      replicas: 3

volumes:
  roleplay-db-data:

networks:
  roleplay-network:
    driver: bridge
  shared-net:
    external: true
