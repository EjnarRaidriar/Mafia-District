services:
  shop-db:
    image: postgres:17
    restart: always
    env_file:
      - shop.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXPOSE_PORT}:5432"
    networks:
      - shared-net

  shop-service:
    image: "crodion/shop-service:latest"
    env_file:
      - shop.env
    environment:
      SERVICE_NAME: shop-service
      SERVICE_ROUTE: /api/shop
      SERVICE_PORT: ${PORT}
      BROKER_URL: http://message-broker:4000
    networks:
      - shared-net
    deploy:
      replicas: 2

volumes:
  shop-db-data:

networks:
  shared-net:
    external: true
