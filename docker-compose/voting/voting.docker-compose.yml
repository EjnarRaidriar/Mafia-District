services:
  voting-db:
    image: ${VOTING_DB_IMAGE}
    platform: linux/amd64
    container_name: ${VOTING_DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${VOTING_DB_USER}
      POSTGRES_PASSWORD: ${VOTING_DB_PASSWORD}
      POSTGRES_DB: ${VOTING_DB_NAME}
    ports:
      - "${VOTING_DB_HOST_PORT}:5432"
    volumes:
      - voting-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VOTING_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared-net

  # Using Docker Compose replicas for horizontal scaling
  # Each replica auto-registers with Service Discovery using its hostname
  # Gateway load-balances requests across all healthy instances
  voting-service:
    platform: linux/amd64
    build: ../../microservices/voting-service
    image: dmindrescu/voting-service:latest
    depends_on:
      voting-db:
        condition: service_healthy
    environment:
      PORT: ${VOTING_SERVICE_PORT:-8071}
      SERVICE_ROUTE: /api/voting
      SERVICE_PORT: ${VOTING_SERVICE_PORT:-8071}
      SERVICE_HEALTH_URL: /api/voting/health
      DATABASE_URL: postgresql://${VOTING_DB_USER}:${VOTING_DB_PASSWORD}@voting-db:5432/${VOTING_DB_NAME}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:3000}
      LOG_BUFFER_SIZE: ${LOG_BUFFER_SIZE:-1000}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-5.0}
      # SERVICE_INSTANCE_ID and SERVICE_TARGET_HOST auto-set from container hostname
    ports:
      - "8071-8073:8071"  # Docker assigns ports to replicas: 8071→replica1, 8072→replica2, 8073→replica3
    networks:
      - shared-net
    restart: unless-stopped
    deploy:
      replicas: 3
    # Access via Gateway (load-balanced): http://localhost:3000/api/voting
    # OR directly: http://localhost:8071, :8072, :8073

networks:
  shared-net:
    external: true

volumes:
  voting-db-data:
