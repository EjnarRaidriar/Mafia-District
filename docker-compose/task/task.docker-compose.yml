services:
  task-db:
    platform: linux/amd64
    image: ${TASK_DB_IMAGE}
    container_name: ${TASK_DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${TASK_DB_USER}
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD}
      POSTGRES_DB: ${TASK_DB_NAME}
    ports:
      - "${TASK_DB_HOST_PORT}:5432"
    volumes:
      - task-service-db-data:/var/lib/postgresql/data
      - ${TASK_DB_INIT_FOLDER}:/docker-entrypoint-initdb.d/
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TASK_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Using Docker Compose replicas for horizontal scaling
  # Each replica auto-registers with Service Discovery using its hostname
  # Gateway load-balances requests across all healthy instances
  task-service:
    platform: linux/amd64
    build: ../../microservices/task-service
    image: ${TASK_SERVICE_IMAGE:-dmindrescu/task-service:latest}
    depends_on:
      task-db:
        condition: service_healthy
    environment:
      PORT: ${TASK_SERVICE_PORT:-8081}
      SERVICE_ROUTE: /api/task
      SERVICE_PORT: ${TASK_SERVICE_PORT:-8081}
      SERVICE_HEALTH_URL: /api/task/health
      DB_DSN: ${TASK_SERVICE_DB_DSN:?TASK_SERVICE_DB_DSN not set}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:3000}
      LOG_BUFFER_SIZE: ${LOG_BUFFER_SIZE:-1000}
      # SERVICE_INSTANCE_ID and SERVICE_TARGET_HOST auto-set from container hostname
    ports:
      - "8101-8103:8081"  # Docker assigns ports to replicas: 8101→replica1, 8102→replica2, 8103→replica3
    networks:
      - shared-net
    restart: unless-stopped
    deploy:
      replicas: 3
    # Access via Gateway (load-balanced): http://localhost:3000/api/task
    # OR directly: http://localhost:8101, :8102, :8103

networks:
  shared-net:
    external: true

volumes:
  task-service-db-data:
