services:
  user-management-db:
    image: ${DB_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-user_password}
      POSTGRES_DB: ${POSTGRES_DB:-pad_user}
    volumes:
      - user_management_db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432"
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-management-service:
    image: ${SERVICE_IMAGE:-edyson1202/user-management-service:1.0}
    environment:
      POSTGRES_HOST: user-management-db
      DB_HOST: user-management-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-pad_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-user_password}
      DB_NAME: ${POSTGRES_DB:-pad_user}
      PORT: ${SERVICE_PORT:-4040}
      GATEWAY_URL: http://gateway:3000
    ports:
      - "4040-4042:${SERVICE_PORT:-4040}"
    depends_on:
      user-management-db:
        condition: service_healthy
    networks:
      - shared-net
    deploy:
      replicas: 3

volumes:
  user_management_db_data:

networks:
  shared-net:
    external: true
