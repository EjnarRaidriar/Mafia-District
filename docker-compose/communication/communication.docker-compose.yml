services:
  communication-db:
    image: "postgres:${DB_VERSION}"
    container_name: ${DB_HOST}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
#    ports:
#      - "5432:5432"
    volumes:
      - communication-db-data:/var/lib/postgresql/data
      - ./db/init:/init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-net

  communication-service:
    platform: linux/amd64
    image: "niksaysit/pad-communication-service:${SVC_VERSION}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GATEWAY_URL: ${GATEWAY_URL}
    # ports:
    #   - "${SVC_PORT_START}-${SVC_PORT_END}:8080"
    depends_on:
      communication-db:
        condition: service_healthy
    networks:
      - shared-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2

volumes:
  communication-db-data:
    name: "${DB_VOLUME}"

networks:
  shared-net:
    external: true
